<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buffett Letters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/letter.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("buffett-letter-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Buffett Letters<span>Partnership &amp; Berkshire</span></a>
    <div class="header-tools">
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="切换到夜间模式">
        <span class="when-light">夜间</span>
        <span class="when-dark">日间</span>
      </button>
      <div class="era-pill">Archive</div>
    </div>
  </header>

  <section class="letter-hero catalog-hero">
    <h1 class="hero-title">Buffett Letters</h1>
    <p class="hero-lede">从合伙年代读起：折线看累计差距，目录选故事。每年一封最易读解读，不用啃长文。</p>
    <div class="catalog-hero-row">
      <p class="catalog-meta" data-catalog-meta></p>
      <a class="catalog-continue" data-catalog-continue hidden href="#">从最新一年继续 →</a>
    </div>
  </section>

  <div class="story-chart" data-story-chart aria-label="道指与合伙累计回报折线图"></div>
  <div data-timeline aria-label="年度主线时间轴"></div>
  <div class="catalog-root" data-catalog="catalog.json"></div>

  <footer class="site-footer">
    <p>解读为学习辅助，译文供核对；不构成投资建议。</p>
    <p class="site-footer-note">维护：更新 <code>years/YYYY/meta.json</code> 后运行 <code>python3 web/tools/sync_catalog.py</code></p>
  </footer>
  <script src="assets/js/letter.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buffett Letters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/letter.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("buffett-letter-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Buffett Letters<span>Partnership &amp; Berkshire</span></a>
    <div class="header-tools">
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="切换到夜间模式">
        <span class="when-light">夜间</span>
        <span class="when-dark">日间</span>
      </button>
      <div class="era-pill">Archive</div>
    </div>
  </header>

  <section class="letter-hero catalog-hero">
    <h1 class="hero-title">按年份阅读股东信</h1>
    <p class="hero-lede">一条主线串起来：道指、合伙业绩与规模。每年单独打磨导读与译文，点进时间轴继续读。</p>
    <p class="catalog-meta" data-catalog-meta></p>
  </section>

  <div data-timeline data-catalog="catalog.json" aria-label="年度主线时间轴"></div>
  <div class="catalog-root" data-catalog="catalog.json"></div>

  <footer class="site-footer">
    新的一年：复制 <code>years/_template</code> → 填内容与 <code>meta.json</code> → 运行
    <code>python3 web/tools/sync_catalog.py</code>
  </footer>
  <script src="assets/js/letter.js"></script>
</body>
</html>
